<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Manager — Management Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header" role="banner">
      <div class="header-left">
        <h1 class="app-title">Server Manager</h1>
        <span class="page-title" id="page-title">Overview</span>
      </div>
      <div class="header-right">
        <span class="api-status" id="api-status" role="status" aria-live="polite">
          <span class="status-dot" id="api-status-dot">●</span>
          <span id="api-status-text">Connecting…</span>
        </span>
        <span class="last-refresh" id="last-refresh"></span>
        <button id="btn-refresh" class="btn btn-secondary" type="button" aria-label="Refresh data">Refresh</button>
        <label class="auto-refresh-toggle">
          <input type="checkbox" id="auto-refresh" checked>
          <span>Auto (30s)</span>
        </label>
      </div>
    </header>

    <div class="app-body">
      <!-- Sidebar Navigation -->
      <nav class="sidebar" role="navigation" aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="#overview" class="nav-link" data-route="overview">Overview</a></li>
          <li><a href="#inventory" class="nav-link" data-route="inventory">Inventory</a></li>
          <li><a href="#topology" class="nav-link" data-route="topology">Topology</a></li>
          <li><a href="#health" class="nav-link" data-route="health">Health &amp; Resources</a></li>
          <li><a href="#faults" class="nav-link" data-route="faults">Faults &amp; Alerts</a></li>
          <li><a href="#operations" class="nav-link" data-route="operations">Operations</a></li>
        </ul>
      </nav>

      <!-- Main Content -->
      <main class="main-content" id="main-content" role="main">
        <div class="loading-state" id="loading-state">
          <p>Loading…</p>
        </div>
      </main>
    </div>

    <!-- Error Banner (global) -->
    <div class="error-banner" id="error-banner" role="alert" hidden>
      <span id="error-banner-text"></span>
      <button class="btn btn-secondary btn-sm" type="button" id="btn-retry">Retry</button>
    </div>
  </div>

  <script src="js/api-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
